<!DOCTYPE html>
<html lang="en">
<head><style>html{visibility:hidden}</style><script>(function(){try{if(localStorage.getItem("studio_access")==="ok"){document.documentElement.style.visibility="visible";return;}}catch(_){}window.location.replace("/");})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Design Studio · RKK</title>
  <meta name="description" content="Design Studio — the in-browser composer for Raghava KK's website. Local editor; not the public art studio." />
  <meta name="theme-color" content="#F4F1EA" />
  <link rel="icon" type="image/png" href="../images/Raghava%20KK%20Logo-02.png" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../render/render.css" />
  <link rel="stylesheet" href="./studio.css" />
</head>
<body>

  <header class="studio-toolbar" id="toolbar">
    <div class="studio-tb-group studio-tb-mark">
      <span class="studio-mark">DESIGN · STUDIO</span>
    </div>

    <div class="studio-tb-group" id="page-controls">
      <select id="page-picker" class="studio-tb-select" aria-label="Page picker"></select>
      <button id="btn-new-page" class="studio-tb-btn" type="button">+ NEW PAGE</button>
      <button id="btn-connect" class="studio-tb-btn" type="button">CONNECT FOLDER</button>
    </div>

    <div class="studio-tb-group" id="add-controls" aria-label="Add elements">
      <span class="studio-tb-label">ADD</span>
      <button class="studio-tb-btn" data-add="text" title="Text">T TEXT</button>
      <button class="studio-tb-btn" data-add="marquee" title="Marquee">M MARQUEE</button>
      <button class="studio-tb-btn" data-add="hero-artifact" title="Hero">H HERO</button>
      <button class="studio-tb-btn" data-add="spec-sheet" title="Spec sheet">S SPEC</button>
      <button class="studio-tb-btn" data-add="single-field" title="Single field">F FIELD</button>
      <button class="studio-tb-btn" data-add="asterism" title="Asterism">· ASTERISM</button>
      <button id="btn-section" class="studio-tb-btn" type="button" title="Insert pre-baked template (bundle of elements)">+ TEMPLATE</button>
      <span class="studio-tb-hint">↳ IMAGE: DROP A PNG</span>
    </div>

    <div class="studio-tb-group" id="history-controls">
      <button id="btn-undo" class="studio-tb-btn" type="button" title="Undo (Cmd+Z)">UNDO</button>
      <button id="btn-redo" class="studio-tb-btn" type="button" title="Redo (Cmd+Shift+Z)">REDO</button>
    </div>

    <div class="studio-tb-group" id="viewport-controls">
      <span class="studio-tb-label">VIEWPORT</span>
      <button id="btn-vp-desktop" class="studio-tb-btn studio-vp-btn is-active" type="button" data-vp="desktop" title="Desktop view (full width)">DT</button>
      <button id="btn-vp-tablet"  class="studio-tb-btn studio-vp-btn" type="button" data-vp="tablet"  title="Tablet view (1024px)">TB</button>
      <button id="btn-vp-phone"   class="studio-tb-btn studio-vp-btn" type="button" data-vp="phone"   title="Phone view (375px)">PH</button>
    </div>

    <div class="studio-tb-group studio-tb-right">
      <span id="save-indicator" class="studio-save" data-state="idle">IDLE</span>
      <button id="btn-view-toggle" class="studio-tb-btn" type="button" title="View mode">PREVIEW</button>
    </div>
  </header>

  <main class="studio-shell">

    <aside class="studio-leftrail" id="leftrail" aria-label="Bank and layers">

      <section class="studio-bank" id="bank" aria-label="Image bank">
        <div class="studio-bank-head">
          <span class="studio-section-title">BANK</span>
          <button id="btn-leftrail-toggle" class="studio-icon-btn" type="button" title="Collapse">‹</button>
        </div>

        <div class="studio-bank-sub">
          <div class="studio-bank-subhead">
            <span>PAGE</span>
            <button id="btn-bank-refresh-page" class="studio-icon-btn" type="button" title="Rescan page assets">↻</button>
          </div>
          <div class="studio-bank-grid" id="bank-grid-page"></div>
        </div>

        <div class="studio-bank-sub">
          <div class="studio-bank-subhead">
            <span>STUDIO</span>
            <button id="btn-bank-refresh-studio" class="studio-icon-btn" type="button" title="Rescan studio bank">↻</button>
          </div>
          <div class="studio-bank-grid" id="bank-grid-studio"></div>
        </div>
      </section>

      <section class="studio-layers" id="layers" aria-label="Layers">
        <div class="studio-layers-head">
          <span class="studio-section-title">LAYERS</span>
        </div>
        <ol class="studio-layers-list" id="layers-list"></ol>
      </section>

    </aside>

    <section class="studio-stage" id="stage">
      <div class="studio-stage-scroll" id="stage-scroll">
        <div id="page-root" class="studio-page-root"></div>
        <div class="studio-overlay" id="overlay" aria-hidden="true"></div>
      </div>
      <div class="studio-drop-hint" id="drop-hint">DROP PNG OR JPG ANYWHERE</div>
    </section>

    <aside class="studio-inspector" id="inspector" aria-label="Inspector">
      <div class="studio-inspector-head">
        <span class="studio-section-title" id="inspector-title">PAGE</span>
      </div>
      <div class="studio-inspector-body" id="inspector-body"></div>
    </aside>

  </main>

  <div class="studio-section-picker" id="section-picker" hidden aria-hidden="true">
    <div class="studio-section-picker-head">
      <span class="studio-section-title">TEMPLATES</span>
      <button id="btn-section-picker-close" class="studio-icon-btn" type="button" title="Close">×</button>
    </div>
    <div class="studio-section-picker-grid" id="section-picker-grid"></div>
  </div>

  <input type="file" id="file-input" accept="image/png,image/jpeg" hidden />

  <script type="module" src="./studio.js"></script>
</body>
</html>
